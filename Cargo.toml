[package]
name = "hvsm_proto"
version = "0.1.12"
edition = "2021"

[lib]
name = "hvsm_proto"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hvsm_proto"
path = "src/main.rs"

[features]
# types.rs gates the Bevy Asset derives behind this; the prototype loads RON with std::fs instead.
bevy = []

[dependencies]
# Feature set: no gamepad (libudev); audio = bevy_audio + ogg/wav (Windows: WASAPI, Linux: ALSA). Builds on Windows/macOS/Linux.
bevy = { version = "0.20", default-features = false, features = [
  "default_app", "std", "bevy_winit", "x11", "multi_threaded", "2d_bevy_render",
  "bevy_audio", "vorbis", "wav", "png", "jpeg",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
fastrand = "2"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "com.benny.heroesvsmonsters"
apk_name = "hvsm"
assets = "assets"
build_targets = ["aarch64-linux-android"]
resources = "android_res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Heroes vs Monsters"
has_code = true
theme = "@android:style/Theme.NoTitleBar.Fullscreen"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
name = "com.benny.hvsm.MainActivity"
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode"

[package.metadata.android.signing.release]
path = "android_keystore/hvsm.jks"
keystore_password = "hvsmhvsm"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

